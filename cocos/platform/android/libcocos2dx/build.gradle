apply plugin: 'com.android.library'

android {
    // AGP 8:package 必须以 namespace 声明(原 manifest package 属性已弃用)
    namespace 'org.cocos2dx.lib'
    compileSdk PROP_COMPILE_SDK_VERSION.toInteger()

    defaultConfig {
        minSdk PROP_MIN_SDK_VERSION.toInteger()
        targetSdk PROP_TARGET_SDK_VERSION.toInteger()
        versionCode 1
        versionName "1.0"
    }

    sourceSets.main {
        aidl.srcDir "../java/src"
        java.srcDir "../java/src"
        manifest.srcFile "AndroidManifest.xml"
    }

    // AGP 8 默认关闭 AIDL;华为游戏调优接口(com.enhance.gameservice)依赖 AIDL 生成
    buildFeatures {
        aidl true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: '../java/libs', include: ['*.jar'])
}
